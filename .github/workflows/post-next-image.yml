name: 'esnupi.me Post Next Image'

on:
  workflow_dispatch:

jobs:
  post-next-image:
    name: Post Next Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          sparse-checkout: |
            /*
            !imagequeue
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: read the all-new no-no list
        run: |
          git fetch origin post-history:post-history 2>/dev/null || true
          if git show post-history:post-history.txt >/dev/null 2>&1; then
            git show post-history:post-history.txt > post-history.txt
          else
            touch post-history.txt
          fi

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'yarn'

      - name: install dependencies
        run: yarn install --immutable

      - name: Poast!
        env:
          NODE_OPTIONS: "--no-deprecation"
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          OVERRIDE_IMAGE: ${{ vars.OVERRIDE_IMAGE }}
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          if [ -n "$OVERRIDE_IMAGE" ]; then
            echo "override detected, posting $OVERRIDE_IMAGE. everything you know is wrong."
            SELECTED_IMAGE="$OVERRIDE_IMAGE"
            gh variable delete OVERRIDE_IMAGE || true
          else
            echo "scanning catalogue..."
            ALL_IMAGES=$(git ls-tree -r HEAD:imagequeue --name-only)
            AVAILABLE=$(echo "$ALL_IMAGES" | grep -vFxf post-history.txt || true)
            if [ -z "$AVAILABLE" ]; then
              echo "all images have been posted. that's wild, honestly. clearing history and starting anew..."
              > post-history.txt
              AVAILABLE="$ALL_IMAGES"
            fi

            TODAY=$(TZ="America/Los_Angeles" date +%m-%d)
            HOLIDAY_FILTER=""

            if [ "$TODAY" = "10-31" ] || [ "$TODAY" = "12-25" ] || [ "$TODAY" = "01-01" ]; then
              echo "it's a holiday! filtering for $TODAY comics..."
              HOLIDAY_FILTER="$TODAY"
            else
              DOW=$(TZ="America/Los_Angeles" date +%u)
              MONTH=$(TZ="America/Los_Angeles" date +%m)
              DAY=$(TZ="America/Los_Angeles" date +%d)
              if [ "$DOW" = "4" ] && [ "$MONTH" = "11" ] && [ "$DAY" -ge 22 ] && [ "$DAY" -le 28 ]; then
                echo "it's thanksgiving! filtering for thanksgiving comics..."
                HOLIDAY_FILTER="thanksgiving"
              fi
            fi

            if [ -n "$HOLIDAY_FILTER" ]; then
              if [ "$HOLIDAY_FILTER" = "thanksgiving" ]; then
                HOLIDAY_AVAILABLE=$(echo "$AVAILABLE" | grep -Ff thanksgiving-dates.txt || true)
              else
                HOLIDAY_AVAILABLE=$(echo "$AVAILABLE" | grep "$HOLIDAY_FILTER" || true)
              fi

              if [ -z "$HOLIDAY_AVAILABLE" ]; then
                echo "all holiday comics have seemingly been posted. cleaning..."
                if [ "$HOLIDAY_FILTER" = "thanksgiving" ]; then
                  grep -vFf thanksgiving-dates.txt post-history.txt > /tmp/cleaned-history.txt || true
                else
                  grep -v "$HOLIDAY_FILTER" post-history.txt > /tmp/cleaned-history.txt || true
                fi
                cp /tmp/cleaned-history.txt post-history.txt
                AVAILABLE=$(echo "$ALL_IMAGES" | grep -vFxf post-history.txt || true)
                if [ "$HOLIDAY_FILTER" = "thanksgiving" ]; then
                  HOLIDAY_AVAILABLE=$(echo "$AVAILABLE" | grep -Ff thanksgiving-dates.txt || true)
                else
                  HOLIDAY_AVAILABLE=$(echo "$AVAILABLE" | grep "$HOLIDAY_FILTER" || true)
                fi
              fi

              if [ -n "$HOLIDAY_AVAILABLE" ]; then
                AVAILABLE="$HOLIDAY_AVAILABLE"
              fi
            fi

            SELECTED_IMAGE=$(echo "$AVAILABLE" | shuf -n 1)
          fi

          echo "your lucky RNG pull of the hour: $SELECTED_IMAGE"
          mkdir -p imagequeue
          git sparse-checkout add "/imagequeue/$SELECTED_IMAGE"
          git checkout "imagequeue/$SELECTED_IMAGE"
          export IMAGE_TO_POST="imagequeue/$SELECTED_IMAGE"
          yarn --silent run start
          echo ""
          echo "$SELECTED_IMAGE" >> post-history.txt

      - name: update the all-new no-no list
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          git config user.name "esnupi"
          git config user.email "esnupi@users.noreply.github.com"
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/MayaTelLabs/esnupi.me.git
          cp post-history.txt /tmp/post-history.txt
          if git rev-parse --verify post-history >/dev/null 2>&1; then
            git checkout post-history
          else
            git checkout --orphan post-history
            git rm -rf . 2>/dev/null || true
          fi
          cp /tmp/post-history.txt post-history.txt
          git add post-history.txt
          git commit -m "update post history" || echo "no changes to commit"
          git push origin post-history