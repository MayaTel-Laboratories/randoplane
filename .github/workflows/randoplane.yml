name: 'randoplane'

on:
  workflow_dispatch:
    inputs:
      override_reg:
        description: 'override'
        required: false
        default: ''

jobs:
  post-random-plane:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: set manufacturer
        id: pick
        shell: bash
        run: |
          INPUT_OVERRIDE="${{ github.event.inputs.override_reg || '' }}"
          VAR_OVERRIDE="${{ vars.OVERRIDE_REG || '' }}"
          if [ -n "$INPUT_OVERRIDE" ]; then
            MAN="$INPUT_OVERRIDE"
            echo "Using workflow input override: $MAN"
          elif [ -n "$VAR_OVERRIDE" ]; then
            MAN="$VAR_OVERRIDE"
            echo "Using repository variable OVERRIDE_REG: $MAN"
          else
            MAN=""
            echo "No override provided; app will use MANUFACTURERS or default list"
          fi
          echo "MANUFACTURER=$MAN" >> $GITHUB_ENV
          echo "MANUFACTURER=$MAN" > picked-manufacturer.txt

      - name: go go go
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          ROOWUS_BASE: ${{ vars.ROOWUS_BASE || 'https://jp.rewis.workers.dev' }}
          JETAPI_PHOTOS: '3'
          JETAPI_USE_THUMBNAIL: 'true'
          POST_DRY_RUN: ${{ vars.POST_DRY_RUN || 'false' }}
        run: |
          yarn --silent run start