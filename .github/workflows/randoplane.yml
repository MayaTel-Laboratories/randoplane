name: 'randoplane'

on:
  workflow_dispatch:
    inputs:
      registration:
        description: 'Force this specific registration to post next (skips the random search). Leave blank for normal behavior.'
        required: false
        type: string

jobs:
  randoplane:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: go go go
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          ROOWUS_BASE: ${{ vars.ROOWUS_BASE || 'https://randoplane-jetphotos-api.kingforpa.workers.dev' }}
          ROOWUS_CACHE_DIR: /home/randoplane/.roowus_cache
          JETAPI_PHOTOS: '5'
          MAX_REG_ATTEMPTS: '50'
          FORCE_REGISTRATION: ${{ inputs.registration || vars.FORCE_REGISTRATION || '' }}
          POST_DRY_RUN: ${{ vars.POST_DRY_RUN || 'false' }}
        run: |
          yarn --silent run start

      - name: Clear one-shot FORCE_REGISTRATION variable
        if: ${{ always() && vars.FORCE_REGISTRATION != '' }}
        continue-on-error: true
        run: |
          curl -sf -X PATCH \
            -H "Authorization: token ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/FORCE_REGISTRATION \
            -d '{"name":"FORCE_REGISTRATION","value":" "}'